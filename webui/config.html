<html>
<head>
  <title>A0 Worktree Settings</title>
  <!-- Schema + logic live in config-store.js (a real .js file) so there are NO HTML-attribute
       quoting limits here. RULE: inside any Alpine attribute use ONLY single quotes for JS strings —
       a raw " terminates the attribute during HTML parsing and silently blanks the panel.
       Uses A0's built-in .field / .section-* classes so it matches the rest of Settings (font/theme). -->
  <script type="module">
    import { store } from "/plugins/a0_worktree/webui/config-store.js";
  </script>
  <style>
    .a0wt-field.safety .field-title::after { content: " \26A0"; color: var(--color-warning, #e0a800); }
  </style>
</head>
<body>
  <!-- $store.a0wtCfg = the schema/helpers (this plugin); `config` = the live settings (A0 provides). -->
  <template x-if="$store.a0wtCfg">
    <div x-data x-init="$store.a0wtCfg.init()">
      <template x-if="config">
        <div>
          <template x-for="sec in $store.a0wtCfg.sections" :key="sec.title">
            <div>
              <div class="section-title" x-text="sec.title"></div>
              <div class="section-description" x-show="sec.desc" x-text="sec.desc"></div>
              <template x-for="f in sec.fields" :key="f.k">
                <div class="field a0wt-field" :class="{ safety: f.safety }" x-show="$store.a0wtCfg.shown(f, config)">
                  <div class="field-label">
                    <div class="field-title" x-text="f.lbl"></div>
                    <div class="field-description" x-show="f.h" x-text="f.h"></div>
                  </div>
                  <div class="field-control">
                    <template x-if="f.t === 'bool'">
                      <label class="toggle"><input type="checkbox" x-model="config[f.k]" /><span class="toggler"></span></label>
                    </template>
                    <template x-if="f.t === 'int'">
                      <input type="number" step="1" x-model.number="config[f.k]" />
                    </template>
                    <template x-if="f.t === 'float'">
                      <input type="number" step="any" x-model.number="config[f.k]" />
                    </template>
                    <template x-if="f.t === 'text'">
                      <input type="text" x-model="config[f.k]" />
                    </template>
                    <template x-if="f.t === 'enum'">
                      <select x-model="config[f.k]" x-init="$nextTick(() => { if (config[f.k] !== undefined) $el.value = config[f.k] })">
                        <template x-for="o in f.opts" :key="o"><option :value="o" x-text="o"></option></template>
                      </select>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</body>
</html>
