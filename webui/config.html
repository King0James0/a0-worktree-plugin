<html>
<head><title>A0 Worktree</title></head>
<body>
<div x-data>
  <template x-if="config">
    <div>
      <div class="section-title">A0 Worktree — per-chat workspace</div>
      <div class="section-description">
        Worktree isolation gives a chat (or a swarm subagent) its own checkout of a repo as a
        project. The option below is a separate, lightweight isolation for everyday chats.
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">Isolate each chat's working directory</div>
          <div class="field-description">
            When on, every chat that has no explicit project gets its own working directory at
            <code>usr/chats/&lt;chat_id&gt;/workdir</code> instead of the shared <code>usr/workdir</code>.
            The chat's code execution, the file list shown to the agent, and saved office documents
            all resolve there, so chats no longer see each other's scratch files. Files live with the
            chat and are removed when the chat is. Real projects and worktrees are never affected.
            Takes effect immediately. Default off.
          </div>
        </div>
        <div class="field-control">
          <label class="toggle">
            <input type="checkbox" x-model="config.isolate_chat_workdir"
              x-init="if (config.isolate_chat_workdir === undefined || config.isolate_chat_workdir === null) config.isolate_chat_workdir = false" />
            <span class="toggler"></span>
          </label>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">Git token secret name</div>
          <div class="field-description">
            Name of an A0 Secret holding a git token, used only when cloning a private remote URL as
            a project. Public remotes and local repos need no token. Read at call time, never stored.
          </div>
        </div>
        <div class="field-control">
          <input type="text" class="text-input" x-model="config.git_token_secret"
            x-init="if (config.git_token_secret === undefined || config.git_token_secret === null) config.git_token_secret = 'GITHUB_TOKEN'" />
        </div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
